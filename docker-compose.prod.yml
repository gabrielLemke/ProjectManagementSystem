services:
  postgres:
    image: postgres:16-alpine
    container_name: pms_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-pms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pms_secure_password}
      POSTGRES_DB: ${DB_NAME:-pms_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pms_user} -d ${DB_NAME:-pms_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pms_prod_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: "postgresql://${DB_USER:-pms_user}:${DB_PASSWORD:-pms_secure_password}@postgres:5432/${DB_NAME:-pms_db}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production_min_32_chars}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    ports:
      - "3333:3333"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3333}
    container_name: pms_prod_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  prod_postgres_data:
    driver: local
